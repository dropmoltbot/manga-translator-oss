<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      width: 340px; 
      padding: 20px; 
      background: linear-gradient(145deg, #0d0d1a, #1a1a2e); 
      color: #fff; 
      font-family: 'Segoe UI', system-ui, sans-serif; 
    }
    h2 { font-size: 18px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .badge { 
      font-size: 10px; 
      background: linear-gradient(135deg,#22c55e,#16a34a); 
      color: #000; 
      padding: 3px 10px; 
      border-radius: 20px; 
      font-weight: 700; 
    }
    p { font-size: 12px; color: #888; margin-bottom: 14px; }
    label { 
      font-size: 11px; 
      color: #666; 
      display: block; 
      margin-bottom: 4px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }
    select, input { 
      width: 100%; 
      padding: 10px; 
      background: rgba(0,0,0,0.5); 
      border: 1px solid rgba(139,92,246,0.3); 
      border-radius: 10px; 
      color: #fff; 
      margin-bottom: 12px; 
      font-size: 13px; 
    }
    select:focus, input:focus { outline: none; border-color: #8b5cf6; }
    button { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg,#8b5cf6,#6366f1); 
      border: none; 
      border-radius: 12px; 
      color: white; 
      font-weight: 600; 
      cursor: pointer; 
      font-size: 13px; 
      transition: transform 0.1s; 
    }
    button:hover { transform: scale(1.02); }
    .info { font-size: 11px; color: #555; margin-top: 16px; line-height: 1.6; border-top: 1px solid #333; padding-top: 12px; }
    .info strong { color: #8b5cf6; }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .toggle { position: relative; width: 44px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; transition: 0.3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; transition: 0.3s; border-radius: 50%; }
    input:checked + .slider { background: #8b5cf6; }
    input:checked + .slider:before { transform: translateX(20px); }
    .status { font-size: 11px; color: #22c55e; margin-top: 8px; display: none; }
    .status.error { color: #ef4444; }
  </style>
</head>
<body>
  <h2>📖 Manga Translator <span class="badge">v1.0</span></h2>
  <p>Privacy-first open-source translator</p>
  
  <label>Target Language</label>
  <select id="lang">
    <option value="en">🇺🇸 English</option>
    <option value="ja">🇯🇵 Japanese</option>
    <option value="ko">🇰🇷 Korean</option>
    <option value="zh">🇨🇳 Chinese</option>
    <option value="fr">🇫🇷 French</option>
    <option value="de">🇩🇪 German</option>
    <option value="es">🇪🇸 Spanish</option>
    <option value="pt">🇧🇷 Portuguese</option>
    <option value="ru">🇷🇺 Russian</option>
    <option value="it">🇮🇹 Italian</option>
  </select>
  
  <label>Translation Provider</label>
  <select id="provider">
    <option value="local">📱 Local (No API)</option>
    <option value="openrouter">🤖 OpenRouter (Free)</option>
    <option value="deepl">🌐 DeepL (API)</option>
  </select>
  
  <label>API Key</label>
  <input type="password" id="apikey" placeholder="Enter API key (optional)">
  
  <div class="toggle-row">
    <span style="font-size:12px;color:#888;">Auto-detect images</span>
    <label class="toggle">
      <input type="checkbox" id="autoDetect" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="toggle-row">
    <span style="font-size:12px;color:#888;">Show overlay buttons</span>
    <label class="toggle">
      <input type="checkbox" id="showOverlay" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <button onclick="saveSettings()">💾 Save Settings</button>
  <div id="status" class="status"></div>
  
  <p class="info">
    <strong>How to use:</strong><br>
    1. Visit any manga/webtoon site<br>
    2. Images are auto-detected<br>
    3. Click 📖 on any image to translate<br><br>
    <strong>Get free API:</strong> openrouter.ai<br>
    <strong>DeepL:</strong> deepl.com/pro-api<br><br>
    <strong>100% Private</strong> - No telemetry
  </p>
  
  <script>
    function saveSettings() {
      const statusEl = document.getElementById('status');
      
      if (typeof chrome !== 'undefined' && chrome.storage) {
        chrome.storage.local.set({
          targetLang: document.getElementById('lang').value,
          provider: document.getElementById('provider').value,
          apiKey: document.getElementById('apikey').value,
          autoDetect: document.getElementById('autoDetect').checked,
          showOverlay: document.getElementById('showOverlay').checked
        }).then(() => {
          statusEl.textContent = '✓ Settings saved!';
          statusEl.className = 'status';
          statusEl.style.display = 'block';
          setTimeout(() => statusEl.style.display = 'none', 2000);
        }).catch(err => {
          statusEl.textContent = '✗ Error: ' + err.message;
          statusEl.className = 'status error';
          statusEl.style.display = 'block';
        });
      } else {
        statusEl.textContent = '⚠ Chrome storage not available';
        statusEl.className = 'status error';
        statusEl.style.display = 'block';
      }
    }
    
    if (typeof chrome !== 'undefined' && chrome.storage) {
      chrome.storage.local.get(['targetLang', 'provider', 'apiKey', 'autoDetect', 'showOverlay'])
        .then(s => {
          if (s.targetLang) document.getElementById('lang').value = s.targetLang;
          if (s.provider) document.getElementById('provider').value = s.provider;
          if (s.apiKey) document.getElementById('apikey').value = s.apiKey;
          if (s.autoDetect !== undefined) document.getElementById('autoDetect').checked = s.autoDetect;
          if (s.showOverlay !== undefined) document.getElementById('showOverlay').checked = s.showOverlay;
        })
        .catch(err => {
          console.log('Could not load settings:', err);
        });
    }
  </script>
</body>
</html>
